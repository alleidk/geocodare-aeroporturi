{% extends "base.html" %}
{% block title %}Autentificare — Geocodare adrese{% endblock %}
{% block content %}
<section class="login">
  <div class="login-brand">
    <svg class="pin" width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    <h1>Geocodare adrese</h1>
    <p class="muted">Transformă adresele dintr-un Excel în coordonate pe hartă.</p>
  </div>
  <form method="post" class="card">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Utilizator <input name="username" autocomplete="username" required autofocus></label>
    <label>Parolă <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary wide">Intră în cont</button>
    <p class="muted small center">Nu ai cont? Cere-l administratorului site-ului.</p>
  </form>
</section>
{% endblock %}
