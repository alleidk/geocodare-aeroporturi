# Pornire pe server: site-ul + Caddy (HTTPS automat pentru domeniu).
# Setări în fișierul .env de lângă acest fișier:
#   DOMAIN=geocodare.exemplu.ro
#   GOOGLE_API_KEY=...
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
